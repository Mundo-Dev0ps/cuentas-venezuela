# Cloudflare Workers config for cuentas-venezuela API.
# Free plan: 100k requests/day, unlimited bandwidth, no card required.
#
# First-time setup (after wrangler login):
#   cd api/
#   wrangler secret put DATABASE_URL              # Neon HTTP connection string
#   wrangler secret put KOFI_VERIFICATION_TOKEN
#   wrangler secret put TURNSTILE_SECRET_KEY      # CF Turnstile secret
#   wrangler deploy
#
# Optional Cloudflare Rate Limiting Rules (free) can be configured in the
# CF dashboard at api.cuentasvenezuela.org instead of running rate-limit.ts
# inside the worker.

name = "cuentas-venezuela-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Plain string vars (non-secret). Override per environment as needed.
[vars]
API_LOG_LEVEL = "info"
CORS_ORIGINS = "https://cuentasvenezuela.org,https://www.cuentasvenezuela.org"

# Public route (after DNS + Cloudflare proxy on cuentasvenezuela.org):
#   api.cuentasvenezuela.org/*   →   this worker
[[routes]]
pattern = "api.cuentasvenezuela.org/*"
zone_name = "cuentasvenezuela.org"

[observability]
enabled = true

# Cloudflare Email Workers — sends notification mails when new ciudadano
# reports land or Ko-fi donations come in. Destination must be a verified
# address inside cuentasvenezuela.org Email Routing (set up in dashboard).
# Free tier: 60 emails/day per destination.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "hola@cuentasvenezuela.org"

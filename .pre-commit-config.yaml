# pre-commit hooks for cuentas-venezuela. Install once per dev machine:
#   pip install --user pre-commit
#   pre-commit install                 # registers .git/hooks/pre-commit
#
# CI also runs gitleaks via .github/workflows/secret-scan.yml; this hook
# blocks the same patterns locally before the commit lands in history.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^etl/

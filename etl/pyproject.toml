[project]
name = "datos-chile-etl"
version = "0.1.0"
description = "ETL pipelines for datos-chile"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.18.0",
    "duckdb>=1.1.3",
    "boto3>=1.35.84",
    "psycopg[binary]>=3.2.3",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "fastexcel>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py312"

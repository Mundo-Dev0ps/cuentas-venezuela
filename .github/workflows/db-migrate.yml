name: db-migrate

# Applies db/schema.sql against the target Postgres (Neon prod by default).
# Idempotent because all DDL uses CREATE ... IF NOT EXISTS.
#
# Until we adopt a real migration tool (drizzle-kit), this acts as the
# declarative apply step. Replace with `drizzle-kit migrate` when
# migrations/ folder lands.

on:
  push:
    branches: [main]
    paths:
      - "db/schema.sql"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options: [prod, staging]

concurrency:
  group: db-migrate-${{ inputs.target || 'prod' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply schema
        env:
          DATABASE_URL: ${{ inputs.target == 'staging' && secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_PROD }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Verify
        env:
          DATABASE_URL: ${{ inputs.target == 'staging' && secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_PROD }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT schema_name FROM information_schema.schemata WHERE schema_name IN ('chile','migracion','macro_ve','ddhh');"

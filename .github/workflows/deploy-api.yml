name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install api deps
        working-directory: api
        run: npm ci

      - name: Typecheck
        working-directory: api
        run: npm run typecheck

      - name: Deploy worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Cloudflare Bot Fight Mode blocks the GitHub Actions ASN on /health,
      # so this is informational only — wrangler deploy is the source of
      # truth for upload success. Don't fail the workflow on 403.
      - name: Smoke test /health (informational)
        continue-on-error: true
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -A "Mozilla/5.0 (CICD-smoke)" \
              https://api.cuentasvenezuela.org/health || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "health check did not return 200 (BFM may block CICD ASN) — see wrangler deploy result above"

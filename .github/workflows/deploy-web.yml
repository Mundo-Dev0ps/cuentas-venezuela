name: deploy-web

# Build Next.js with @opennextjs/cloudflare, then deploy the resulting
# Worker bundle via `wrangler deploy`. Same pattern as deploy-api.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Cloudflare Workers (next-on-pages successor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (@opennextjs/cloudflare)
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_URL: https://cuentasvenezuela.org
          NEXT_PUBLIC_API_URL: https://api.cuentasvenezuela.org
          INTERNAL_API_URL: https://api.cuentasvenezuela.org
          NEXT_PUBLIC_KOFI_URL: https://ko-fi.com/donjonny
          NEXT_PUBLIC_REPO_URL: https://github.com/${{ github.repository }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Deploy worker
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

name: deploy-web

# Build Next.js with @cloudflare/next-on-pages, then publish .vercel/output/static
# to Cloudflare Pages. PR builds get preview URLs; main branch goes to prod.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (next-on-pages adapter)
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_URL: https://cuentasvenezuela.com
          NEXT_PUBLIC_API_URL: https://api.cuentasvenezuela.com
          INTERNAL_API_URL: https://api.cuentasvenezuela.com
          NEXT_PUBLIC_KOFI_URL: https://ko-fi.com/donjonny
          NEXT_PUBLIC_REPO_URL: https://github.com/${{ github.repository }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx @cloudflare/next-on-pages

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cuentas-venezuela
          directory: web/.vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}

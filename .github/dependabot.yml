version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      deck-gl:
        patterns: ["@deck.gl/*", "deck.gl"]
      maplibre:
        patterns: ["maplibre-gl", "react-map-gl"]
      tailwind:
        patterns: ["tailwindcss", "autoprefixer", "postcss"]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
